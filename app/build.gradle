plugins {
    id 'com.android.application'
}

android {
    namespace 'com.catloft.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.catloft.launcher"
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intentionally empty: pure framework code, no support/androidx libraries.
}
